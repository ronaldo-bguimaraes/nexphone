name: nexphone

services:
  gateway:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: nexphone/gateway:0.1.0
    env_file:
      - .env
    environment:
      NEXPHONE_CONFIG: /config/nexphone.yaml
      NEXPHONE_INTERNAL_PORT: "8080"
      NEXPHONE_DATA_PATH: /data
      NEXPHONE_STATE_PATH: /state
      NEXPHONE_SCRCPY_SERVER: /opt/nexphone/scrcpy-server.jar
      NEXPHONE_RUNTIME_DATA_VOLUME: nexphone-data
      NEXPHONE_RUNTIME_NETWORK: nexphone_default
    volumes:
      - ../config/nexphone.yaml:/config/nexphone.yaml:ro
      - nexphone-data:/data
      - nexphone-state:/state
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - caddy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  runtime:
    # Optional profile: the gateway creates and manages this container on
    # demand. Enable the profile only if you want Compose to own its lifecycle.
    profiles: ["runtime"]
    image: ${NEXPHONE_RUNTIME_IMAGE:?set NEXPHONE_RUNTIME_IMAGE in deploy/.env}
    container_name: nexphone-runtime
    privileged: false
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - nexphone-data:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=30
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
    restart: "no"

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  nexphone-data:
    name: nexphone-data
  nexphone-state:
    name: nexphone-state
  caddy-data:
  caddy-config:
